<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Happy Valentine's Day!</h1>
        <p>Wishing you a day filled with love, joy, and happiness.</p>
        <button id="heartButton">Click for a Surprise!</button>
        <div id="surprise" class="hidden">
            <p>💖 You are loved! 💖</p>
        </div>
    </div>

    <!-- Heart Animation -->
    <div class="hearts">
        <div class="heart">💖</div>
        <div class="heart">💖</div>
        <div class="heart">💖</div>
        <div class="heart">💖</div>
        <div class="heart">💖</div>
    </div>

    <!-- Confetti Animation -->
    <canvas id="confetti"></canvas>

    <script src="script.js"></script>
</body>
</html>
